<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5ecdf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8ddd0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a07830;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Full background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Sky -->
  <rect width="800" height="300" fill="#e8ddd0"/>
  
  <!-- Ground -->
  <rect y="300" width="800" height="300" fill="#d4c4b0"/>
  
  <!-- Building/Palace structure -->
  <g id="building">
    <!-- Main structure -->
    <rect x="150" y="180" width="500" height="250" fill="url(#buildingGrad)" stroke="#6b5544" stroke-width="2"/>
    
    <!-- Dome -->
    <ellipse cx="400" cy="150" rx="120" ry="100" fill="#d4b86a" stroke="#6b5544" stroke-width="2"/>
    <circle cx="400" cy="80" r="30" fill="#f5dfa0"/>
    
    <!-- Windows -->
    <rect x="200" y="220" width="40" height="40" fill="#5d7394" opacity="0.6"/>
    <rect x="290" y="220" width="40" height="40" fill="#5d7394" opacity="0.6"/>
    <rect x="380" y="220" width="40" height="40" fill="#5d7394" opacity="0.6"/>
    <rect x="470" y="220" width="40" height="40" fill="#5d7394" opacity="0.6"/>
    <rect x="560" y="220" width="40" height="40" fill="#5d7394" opacity="0.6"/>
    
    <!-- Lower windows -->
    <rect x="200" y="300" width="40" height="40" fill="#5d7394" opacity="0.6"/>
    <rect x="290" y="300" width="40" height="40" fill="#5d7394" opacity="0.6"/>
    <rect x="380" y="300" width="40" height="40" fill="#5d7394" opacity="0.6"/>
    <rect x="470" y="300" width="40" height="40" fill="#5d7394" opacity="0.6"/>
    <rect x="560" y="300" width="40" height="40" fill="#5d7394" opacity="0.6"/>
    
    <!-- Decorative pillars -->
    <rect x="120" y="280" width="30" height="150" fill="#9c8474"/>
    <rect x="650" y="280" width="30" height="150" fill="#9c8474"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="450" r="50" fill="#c9a84c" opacity="0.3"/>
  <circle cx="700" cy="500" r="60" fill="#5d7394" opacity="0.2"/>
  
  <!-- Text -->
  <text x="400" y="550" font-size="36" fill="#6b5544" text-anchor="middle" font-family="serif" opacity="0.6">
    Venue Placeholder
  </text>
</svg>